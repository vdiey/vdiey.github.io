<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vidiey Shortener</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white flex items-center justify-center min-h-screen p-4">
    <div class="max-w-md w-full bg-slate-800 p-8 rounded-2xl shadow-xl border border-slate-700">
        <h1 class="text-2xl font-bold text-blue-400 mb-6 text-center">Vidiey URL Shortener</h1>
        
        <input type="url" id="longUrl" placeholder="Tempel link panjang di sini..." 
            class="w-full p-3 rounded-lg bg-slate-700 border border-slate-600 mb-4 focus:ring-2 focus:ring-blue-500 outline-none">
        
        <button onclick="generateLink()" id="btn" class="w-full bg-blue-600 hover:bg-blue-500 py-3 rounded-lg font-bold transition">
            Pendekkan Link!
        </button>

        <div id="result" class="hidden mt-6 p-4 bg-slate-900 rounded-lg border border-dashed border-slate-500">
            <p class="text-xs text-gray-400 mb-2 uppercase">Hasil Link Pendek:</p>
            <div class="flex items-center justify-between overflow-hidden">
                <a id="shortUrl" href="#" target="_blank" class="text-blue-300 truncate mr-2"></a>
                <button onclick="copyLink()" class="bg-slate-700 px-3 py-1 rounded text-xs hover:bg-slate-600">Salin</button>
            </div>
        </div>
    </div>

    <script>
        async function generateLink() {
            const longUrl = document.getElementById('longUrl').value;
            const btn = document.getElementById('btn');
            if(!longUrl) return alert("Masukkan URL!");

            btn.innerText = "Processing...";
            btn.disabled = true;

            try {
                const response = await fetch('/shorten', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ longUrl })
                });

                const data = await response.json();
                document.getElementById('shortUrl').innerText = data.shortUrl;
                document.getElementById('shortUrl').href = data.shortUrl;
                document.getElementById('result').classList.remove('hidden');
            } catch (err) {
                alert("Gagal membuat link. Pastikan KV Binding sudah diset.");
            } finally {
                btn.innerText = "Pendekkan Link!";
                btn.disabled = false;
            }
        }

        function copyLink() {
            const url = document.getElementById('shortUrl').innerText;
            navigator.clipboard.writeText(url);
            alert("Tersalin ke clipboard!");
        }
    </script>
</body>
</html>
