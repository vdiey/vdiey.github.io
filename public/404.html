<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>404 — Page Not Found</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:Arial,sans-serif}
    body{display:grid;place-items:center;background:#0b0b0b;color:#fff;padding:24px}
    main{text-align:center;max-width:620px}
    .code{font-size:clamp(72px,16vw,150px);font-weight:800;line-height:.9;margin:0}
    h1{font-size:30px;margin:24px 0 10px}
    p{color:#aaa;line-height:1.6;margin:0 0 24px}
    a{display:inline-block;padding:12px 20px;border-radius:8px;background:#fff;color:#000;text-decoration:none;font-weight:700}
  </style>
</head>
<body>
  <main>
    <div class="code">404</div>
    <h1>Page not found</h1>
    <p>The short URL does not exist or has expired.</p>
    <a href="/">Back to homepage</a>
  </main>
</body>
</html>
