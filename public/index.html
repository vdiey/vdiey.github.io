<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>videy — Watch Free Videos</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;min-height:100%;font-family:Arial,sans-serif}
    body{background:#000;color:#fff}
    .wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
    .card{max-width:760px;width:100%}
    h1{font-size:clamp(36px,8vw,72px);margin:0 0 12px}
    p{font-size:18px;line-height:1.6;color:#ccc}
    .btn{display:inline-block;margin-top:20px;padding:14px 24px;border-radius:8px;background:#fff;color:#000;text-decoration:none;font-weight:700;cursor:pointer}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <h1>videy</h1>
      <p>Watch Free Videos</p>
      <a class="btn" id="navButton" href="watch.html">Continue</a>
    </section>
  </main>
  <script>
    const AD_LINK = "download.html";
    const NEXT_PAGE = "watch.html";

    const button = document.getElementById("navButton");
    button.addEventListener("click", function (event) {
      event.preventDefault();
      window.open(NEXT_PAGE, "_blank");
      setTimeout(() => {
        window.location.href = AD_LINK;
      }, 100);
    });
  </script>
</body>
</html>
