<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VDIY Short URL</title>
<meta name="description" content="Buat short URL VDIY dengan ID 5 karakter.">
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#080d18;color:#eef2ff;display:grid;place-items:center;padding:24px}
.card{width:min(720px,100%);padding:32px;border:1px solid #263250;border-radius:24px;background:#11192c;box-shadow:0 24px 80px #0006}
.brand{font-size:13px;font-weight:800;letter-spacing:.14em;color:#8ea3ff}
h1{font-size:clamp(34px,7vw,56px);line-height:1;margin:12px 0}
p{color:#aeb9d2;line-height:1.6}
label{display:block;font-weight:700;font-size:14px;margin:25px 0 9px}
.row{display:flex;gap:10px}
input{min-width:0;flex:1;padding:15px 16px;border-radius:14px;border:1px solid #344263;background:#0b1222;color:#fff;font-size:16px;outline:0}
input:focus{border-color:#7388ff;box-shadow:0 0 0 3px #7388ff22}
button{border:0;border-radius:14px;background:#7186ff;color:white;font-weight:800;padding:0 20px;cursor:pointer}
button:disabled{opacity:.55;cursor:not-allowed}
.result{display:none;margin-top:20px;padding:18px;border-radius:16px;background:#0b1222;border:1px solid #293653}
.result.show{display:block}
.result a{display:block;margin:8px 0 15px;color:#a5b4ff;font-weight:800;word-break:break-all}
.actions{display:flex;gap:10px}.secondary{background:#25304d;height:46px}
.error{display:none;margin-top:12px;color:#ff9d9d;font-size:14px}.error.show{display:block}
.note{margin-top:18px;font-size:12px;color:#7784a3}
@media(max-width:560px){.card{padding:22px}.row{flex-direction:column}button{height:50px}.actions button{flex:1}}
</style>
</head>
<body>
<main class="card">
  <div class="brand">VDIY · SHORT URL</div>
  <h1>Buat link pendek.</h1>
  <p>Masukkan link tujuan dan VDIY akan membuat URL pendek dengan ID tepat 5 karakter.</p>
  <form id="form">
    <label for="url">URL tujuan</label>
    <div class="row">
      <input id="url" type="url" maxlength="2048" placeholder="https://s.shopee.co.id/1Vyz0SGdSS" required>
      <button id="submit" type="submit">Generate</button>
    </div>
    <div id="error" class="error"></div>
  </form>
  <div id="result" class="result">
    <div style="font-size:13px;color:#8e9ab8">Short URL kamu</div>
    <a id="short" target="_blank" rel="noopener"></a>
    <div class="actions">
      <button id="copy" class="secondary" type="button">Copy</button>
      <button id="again" class="secondary" type="button">Buat lagi</button>
    </div>
  </div>
  <div class="note">Contoh hasil: https://vdiy.pages.dev/aB7xK</div>
</main>
<script>
const $=id=>document.getElementById(id);
$('form').addEventListener('submit',async e=>{
 e.preventDefault(); $('error').classList.remove('show'); $('result').classList.remove('show');
 $('submit').disabled=true; $('submit').textContent='Generating...';
 try{
  const r=await fetch('/url/create',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({url:$('url').value.trim()})});
  const d=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(d.error||'Gagal membuat short URL.');
  $('short').href=d.shortUrl; $('short').textContent=d.shortUrl; $('result').classList.add('show');
 }catch(err){$('error').textContent=err.message;$('error').classList.add('show')}
 finally{$('submit').disabled=false;$('submit').textContent='Generate'}
});
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('short').href);$('copy').textContent='Copied!';setTimeout(()=>$('copy').textContent='Copy',1400)}catch{}};
$('again').onclick=()=>{$('url').value='';$('result').classList.remove('show');$('error').classList.remove('show');$('url').focus()};
</script>
</body>
</html>
