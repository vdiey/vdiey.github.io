<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Short URL Generator</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:Arial,sans-serif}
    body{background:#f5f5f5;color:#111;display:grid;place-items:center;padding:24px}
    .card{width:min(680px,100%);background:#fff;border:1px solid #ddd;border-radius:14px;padding:28px;box-shadow:0 10px 30px rgba(0,0,0,.06)}
    h1{margin:0 0 8px;font-size:30px}
    .sub{margin:0 0 24px;color:#666}
    label{display:block;font-weight:700;margin-bottom:8px}
    input{width:100%;padding:13px 14px;border:1px solid #bbb;border-radius:8px;font-size:16px}
    button{margin-top:14px;width:100%;padding:13px 16px;border:0;border-radius:8px;background:#111;color:#fff;font-size:16px;font-weight:700;cursor:pointer}
    button:disabled{opacity:.6;cursor:not-allowed}
    .msg{margin-top:18px;padding:14px;border-radius:8px;display:none;word-break:break-word}
    .error{display:block;background:#fff0f0;color:#a40000}
    .success{display:block;background:#effff2;color:#126b24}
    .result a{font-weight:700}
    .back{display:inline-block;margin-top:20px;color:#333}
  </style>
</head>
<body>
  <main class="card">
    <h1>Short URL Generator</h1>
    <p class="sub">Create a 5-character alphanumeric short URL.</p>

    <form id="form">
      <label for="destination">Destination URL</label>
      <input id="destination" name="destination" type="url"
             placeholder="https://example.com/your-long-url"
             required maxlength="2048" autocomplete="url">
      <button id="submit" type="submit">Generate Short URL</button>
    </form>

    <div id="message" class="msg"></div>
    <a class="back" href="/">← Back to homepage</a>
  </main>

  <script>
    const form = document.getElementById("form");
    const input = document.getElementById("destination");
    const button = document.getElementById("submit");
    const message = document.getElementById("message");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      message.className = "msg";
      message.textContent = "";
      button.disabled = true;
      button.textContent = "Generating…";

      try {
        const response = await fetch("/url/create", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({destination: input.value.trim()})
        });

        const data = await response.json().catch(() => ({}));

        if (!response.ok) {
          throw new Error(data.error || "Failed to create short URL.");
        }

        message.className = "msg success";
        message.innerHTML =
          'Short URL: <a href="' + data.shortUrl + '">' +
          data.shortUrl + '</a>';
      } catch (error) {
        message.className = "msg error";
        message.textContent = error.message;
      } finally {
        button.disabled = false;
        button.textContent = "Generate Short URL";
      }
    });
  </script>
</body>
</html>
