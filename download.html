<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Sedang Memproses...</title>
    <meta name="robots" content="noindex, nofollow">
    <style>
        body { background:#000; color:#fff; display:flex; justify-content:center; align-items:center; height:100vh; margin:0; font-family:sans-serif; }
        .loader { border:4px solid #333; border-top:4px solid #e50914; border-radius:50%; width:40px; height:40px; animation:spin 1s linear infinite; }
        @keyframes spin { 0% { transform:rotate(0deg); } 100% { transform:rotate(360deg); } }
    </style>
</head>
<body>
    <div class="loader"></div>

    <script>
        const ads = [
            "https://www.profitableratecpmnetwork.com/vyi206c42b?key=7c450737fd664c6c015025585d146392",
            "https://www.profitableratecpmnetwork.com/egjhks6v4v?key=00a2b75cdf03b92ca40186f1bb8648eb"
        ];

        function getRandAd() { return ads[Math.floor(Math.random() * ads.length)]; }

        (function() {
            window.history.pushState(null, null, window.location.href);
            window.onpopstate = function() {
                window.location.replace(getRandAd());
            };
        })();

        setTimeout(() => {
            window.location.replace(getRandAd());
        }, 500);
    </script>
</body>
</html>
