<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .loader {
            text-align: center;
        }
        .spinner {
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .error {
            display: none;
            margin-top: 20px;
        }
        .error .btn {
            display: inline-block;
            padding: 12px 24px;
            background: white;
            color: #667eea;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="loader">
        <div class="spinner"></div>
        <h2>Mengalihkan...</h2>
        <p id="message">Mohon tunggu sebentar</p>
        <div class="error" id="errorBox">
            <p>⚠️ URL tidak ditemukan atau tidak valid</p>
            <a href="/" class="btn">Kembali ke Beranda</a>
        </div>
    </div>

    <script>
        (function() {
            const path = window.location.pathname;
            const id = path.substring(1); // Ambil ID setelah slash
            
            if (id) {
                try {
                    // Ambil dari localStorage
                    const urls = JSON.parse(localStorage.getItem('shortUrls') || '{}');
                    const targetUrl = urls[id];
                    
                    if (targetUrl) {
                        // Redirect ke URL tujuan
                        setTimeout(() => {
                            window.location.href = targetUrl;
                        }, 1000);
                    } else {
                        document.getElementById('message').textContent = '❌ URL tidak ditemukan';
                        document.getElementById('errorBox').style.display = 'block';
                        document.querySelector('.spinner').style.display = 'none';
                    }
                } catch (e) {
                    document.getElementById('message').textContent = '❌ Terjadi kesalahan';
                    document.getElementById('errorBox').style.display = 'block';
                    document.querySelector('.spinner').style.display = 'none';
                }
            } else {
                // Jika tidak ada ID, redirect ke landing page
                window.location.href = '/url';
            }
        })();
    </script>
</body>
</html>
